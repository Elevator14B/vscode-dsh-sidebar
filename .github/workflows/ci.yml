name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, unit tests, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package the VSIX
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  contract:
    name: contract smoke against the tested dsh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep this in step with the CLI version the README documents as tested.
      - name: Install the DeepSeek Harness CLI
        run: npm install -g @deepseek-ai/dsh@0.2.0-rc.1
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke

  contract-latest:
    name: contract smoke against dsh latest (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the latest DeepSeek Harness CLI
        run: npm install -g @deepseek-ai/dsh@latest
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
