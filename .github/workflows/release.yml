name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build and attach the VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Attach the VSIX to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          fail_on_unmatched_files: true
          generate_release_notes: true
# Publishing to the VS Code Marketplace or Open VSX is intentionally not wired
# up yet: it needs a publisher identity and, from December 2026 on, Entra ID
# based authentication instead of a personal access token.
